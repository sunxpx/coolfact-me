<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>冷知识漫游笔记 — coolfact.me</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>❄️</text></svg>">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: #0f0f0f;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1.7;
            overflow: hidden;
        }

        /* ── 手电筒光晕 ── */
        .glow {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
            background: radial-gradient(circle 400px at 50% 50%, rgba(255,255,255,0.07), transparent 60%);
            transition: background 0.12s ease-out;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 480px;
            padding: 48px 28px;
            text-align: center;
        }

        .avatar {
            width: 88px;
            height: 88px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 24px;
            border: 2px solid rgba(255,255,255,0.08);
            animation: fadeUp 0.8s ease both;
        }

        h1 {
            font-size: 22px;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 8px;
            letter-spacing: 2px;
            animation: fadeUp 0.8s ease 0.1s both;
        }

        .subtitle {
            font-size: 14px;
            color: #888;
            margin-bottom: 32px;
            animation: fadeUp 0.8s ease 0.15s both;
        }

        .divider {
            width: 40px;
            height: 1px;
            background: rgba(255,255,255,0.1);
            margin: 0 auto 32px;
            animation: fadeUp 0.8s ease 0.2s both;
        }

        .tagline-line {
            font-size: 15px;
            color: #aaa;
            line-height: 1.8;
            opacity: 0;
            animation: fadeUp 0.8s ease both;
        }
        .tagline-line:nth-child(1) { animation-delay: 0.3s; }
        .tagline-line:nth-child(2) { animation-delay: 0.55s; }

        .tagline em {
            color: #ccc;
            font-style: normal;
            border-bottom: 1px dotted rgba(255,255,255,0.15);
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
            margin-top: 32px;
        }

        .link {
            display: block;
            width: 100%;
            max-width: 280px;
            padding: 14px 20px;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 10px;
            color: #ccc;
            text-decoration: none;
            font-size: 15px;
            transition: all 0.25s ease;
            background: rgba(255,255,255,0.02);
            opacity: 0;
            animation: fadeUp 0.8s ease both;
        }
        .link:nth-child(1) { animation-delay: 0.7s; }
        .link:nth-child(2) { animation-delay: 0.8s; }
        .link:nth-child(3) { animation-delay: 0.9s; }

        .link:hover {
            border-color: rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.05);
            color: #fff;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ── 跑马灯 ── */
        .marquee-wrap {
            margin-top: 48px;
            max-width: 480px;
            overflow: hidden;
            mask-image: linear-gradient(to right, transparent, black 10%, black 90%, transparent);
            -webkit-mask-image: linear-gradient(to right, transparent, black 10%, black 90%, transparent);
        }

        .marquee {
            display: flex;
            width: max-content;
            animation: scroll 36s linear infinite;
            font-size: 12px;
            color: #444;
            letter-spacing: 1px;
        }

        .marquee span {
            white-space: nowrap;
            padding-right: 40px;
        }

        @keyframes scroll {
            from { transform: translateX(0); }
            to   { transform: translateX(-50%); }
        }
    </style>
</head>
<body>

    <!-- 手电筒光晕 -->
    <div class="glow" id="glow"></div>

    <div class="container">
        <img class="avatar" src="https://aiarea.qclaw.qq.com/qclawimage/avatar/default/chengxuyuan.png" alt="冷知识漫游笔记">

        <h1>冷知识漫游笔记</h1>
        <p class="subtitle">coolfact.me</p>

        <div class="divider"></div>

        <p class="tagline-line">一个给孩子收集世界冷知识的好奇爸爸。</p>
        <p class="tagline-line">每条内容，都以<em>「我要讲给 Ta 听」</em>的标准筛选。</p>

        <div class="links">
            <a class="link" href="https://www.douyin.com/user/MS4wLjABAAAAzvCzNcz4WVxs0m9-pNaGWBU8EK4ybBRRJKCknKkr3y0" target="_blank">
                🎵 抖音
            </a>
            <a class="link" href="https://www.kuaishou.com/profile/3xd6mn2vamdcjd4" target="_blank">
                ⚡ 快手
            </a>
            <a class="link" href="https://www.xiaohongshu.com/user/profile/5f2fa32c0000000001004946" target="_blank">
                📕 小红书
            </a>
        </div>

        <!-- 跑马灯 -->
        <div class="marquee-wrap">
            <div class="marquee" id="marquee">
                <span>西瓜跟黄瓜一家</span>
                <span>竹子是草不是树</span>
                <span>彩虹是光的骗局</span>
                <span>花生和豌豆是亲戚</span>
                <span>草莓不是水果是花托</span>
                <span>章鱼有三个心脏</span>
                <span>爆米花是压力容器</span>
                <span>西瓜跟黄瓜一家</span>
                <span>竹子是草不是树</span>
                <span>彩虹是光的骗局</span>
                <span>花生和豌豆是亲戚</span>
                <span>草莓不是水果是花托</span>
                <span>章鱼有三个心脏</span>
                <span>爆米花是压力容器</span>
            </div>
        </div>
    </div>

    <script>
        // 鼠标光晕
        const glow = document.getElementById('glow');
        document.addEventListener('mousemove', e => {
            glow.style.background = `radial-gradient(circle 300px at ${e.clientX}px ${e.clientY}px, rgba(255,255,255,0.04), transparent 70%)`;
        });

        // 移动端触摸
        document.addEventListener('touchmove', e => {
            const t = e.touches[0];
            glow.style.background = `radial-gradient(circle 300px at ${t.clientX}px ${t.clientY}px, rgba(255,255,255,0.04), transparent 70%)`;
        });
    </script>
</body>
</html>
