---
layout: default
---
<article>
    <div class="post-date">{{ page.date | date: "%Y.%m.%d" }}</div>
    <h1>{{ page.title }}</h1>

    <div class="content">
        {{ content }}
    </div>

    {% if page.tender_tail %}
    <div class="tender-tail">
        <p>{{ page.tender_tail }}</p>
    </div>
    {% endif %}
</article>
